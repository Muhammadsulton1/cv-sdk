DataReader:
  type: reader
  description: "Сервис для чтения видео потока"
  out_channel: router
  settings:
    batch_size: 1
    skip_frames: 0 # пропускает кадры между сборами батча
    frames_skip_batch: 0 # пропускает кадры после сбора батча
    source: ../../video/test_maneken.mp4
    #source: ../video/test_maneken.mp4

DataReader2:
  type: reader
  description: "Сервис для чтения видео потока"
  out_channel: router
  settings:
    batch_size: 12
    skip_frames: 0
    source: ../../video/test_maneken.mp4

DataRouter:
  type: router
  description: "Сервис для перенаправления кадров между сервисами инференса"
  in_channel: router
  out_channel: inference

InferenceModel:
  type: inference
  description: "Сервис инференса"
  in_channel: inference
  out_channel: aggregator

Aggregator:
  type: aggregator
  description: "Сервис для агрегации результатов инференса"
  in_channel: aggregator
  out_channel: sender